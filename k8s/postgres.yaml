apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cvflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: cvflow
        - name: POSTGRES_USER
          value: cvflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvflow-secrets
              key: postgres-password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cvflow
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: cvflow
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
